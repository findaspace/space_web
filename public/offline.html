<!doctype html>
<html lang="en-GH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Offline · Findaspace</title>
<style>
  /* Self-contained on purpose: when this page is shown there is no network,
     so it cannot load the app's stylesheet. The colours are the paper, ink,
     muted ink and action tokens from globals.css, repeated here for that
     reason alone. */
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
         background: #FFFFFF; color: #171717; font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 22rem; padding: 2rem 1rem; text-align: center; }
  h1 { font-size: 22px; line-height: 28px; margin: 0; }
  p { font-size: 17px; line-height: 22px; color: #595959; margin: .75rem 0 0; }
  button { margin-top: 1.5rem; height: 48px; padding: 0 1.5rem; border: 0; border-radius: 10px;
           background: #111111; color: #fff; font: 600 17px/22px inherit; }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>Reconnect to browse spaces, contact owners and manage your listings. Your saved spaces stay stored on this device.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
